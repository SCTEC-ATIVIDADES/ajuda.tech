name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Testes automatizados (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar configuração Django
        env:
          SECRET_KEY: django-insecure-ci-key-nao-usar-em-producao
          LLM_API_KEY: sk-test-dummy-key-para-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py check

      - name: Aplicar migrações
        env:
          SECRET_KEY: django-insecure-ci-key-nao-usar-em-producao
          LLM_API_KEY: sk-test-dummy-key-para-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py migrate --no-input

      - name: Analisar logs sem rede externa
        run: python analyze_observability.py chat/tests/observability_fixture.json > observability-analysis.json

      - name: Executar testes com cobertura
        env:
          SECRET_KEY: django-insecure-ci-key-nao-usar-em-producao
          LLM_API_KEY: sk-test-dummy-key-para-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          pytest \
            --cov=chat \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Publicar artefatos de análise
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ matrix.python-version }}
          path: |
            observability-analysis.json
            coverage.xml

  frontend-test:
    name: Testes frontend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint frontend
        run: npm run lint

      - name: Executar testes Vitest
        run: npm test

  docker-validation:
    name: Validar imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build --tag ajuda-tech-ci .
      - name: Validar Django no container
        env:
          SECRET_KEY: django-insecure-ci-key-nao-usar-em-producao
          LLM_API_KEY: sk-test-dummy-key-para-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          docker run --rm \
            -e SECRET_KEY \
            -e LLM_API_KEY \
            -e DEBUG \
            -e ALLOWED_HOSTS \
            ajuda-tech-ci python manage.py check
          docker run --rm \
            -e SECRET_KEY \
            -e LLM_API_KEY \
            -e DEBUG \
            -e ALLOWED_HOSTS \
            ajuda-tech-ci python manage.py migrate --no-input
      - name: Testar backend no container
        env:
          SECRET_KEY: django-insecure-ci-key-nao-usar-em-producao
          LLM_API_KEY: sk-test-dummy-key-para-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          docker run --rm \
            -e SECRET_KEY \
            -e LLM_API_KEY \
            -e DEBUG \
            -e ALLOWED_HOSTS \
            ajuda-tech-ci pytest --cov=chat --cov-fail-under=80 -q
      - name: Analisar fixture no container
        run: |
          docker run --rm ajuda-tech-ci \
            python analyze_observability.py chat/tests/observability_fixture.json > docker-observability-analysis.json
      - name: Publicar evidências Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-validation-evidence
          path: docker-observability-analysis.json
